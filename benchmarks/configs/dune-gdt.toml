# dune-gdt — a DUNE module for grid-based discretisation methods.
# Pinned to a concrete commit on `main` (no upstream release tag is published)
# so runs stay reproducible; bump it to re-baseline. Adjust `repo`/`ref` to
# match your fork if needed. This depends on the wider DUNE stack, which the
# `cmake_preset` below installs via vcpkg — the one config here that is not
# parseable straight out of its checkout.
name = "dune-gdt"
repo = "https://github.com/dune-gdt/dune-gdt.git"
ref = "26587316c443e89a54a99afd532a8a6b679ef872" # main @ 2026-08-25
# The clang22-debug preset builds at C++20; parsing at c++17 would not be the
# code the compiler sees.
std = "c++20"
# The harness runs this before parsing. vcpkg pulls in the DUNE stack the deep
# include tree needs, and configure generates config.h + dune-gdt-config.hh;
# without it libclang cannot resolve dune/common/*, which is what this project
# used to fail on. Cold, it builds the whole stack and takes about an hour.
cmake_preset = "clang22-debug"
# dune-gdt resolves its interpreter with `uv python find` from the source dir
# (CMakeLists.txt), which walks *up* and finds benchmarks/.venv — the harness's
# own environment, holding the clangquill build under test — then FORCEs it and
# pip-installs DUNE's python packages into it. The clone lives under
# benchmarks/, so this always hits; OFF keeps dune on its own venv.
cmake_args = [
    "-DDXT_USE_UV_PYTHON=OFF",
    "-DDUNE_PYTHON_EXTERNAL_VIRTUALENV_FOR_ABSOLUTE_BUILDDIR=OFF",
]
# Everything past "." is generated by that configure. The vcpkg triplet is
# spelled out because the harness has no reason to guess it.
include_dirs = [
    ".",
    "build/clang22-debug/vcpkg_installed/x64-linux-shared/include",
    "build/clang22-debug",
    "build/clang22-debug/include",
]
# dune-common's indices.hh uses `operator"" _ic` with a space, which clang 22
# deprecated. Upstream code we cannot fix, and --warnings-as-errors is fatal.
compile_args = ["-Wno-deprecated-literal-operator"]
# Top-level headers only on both sides: clangquill's glob is single-level, so
# Doxygen must not recurse into the (much larger) subtree — otherwise the two
# tools time unequal workloads. Widen both sides together if you want the deep
# tree; the configured build makes it parseable, just far slower.
inputs = ["dune/gdt/*.hh"]
doxygen_input = ["dune/gdt"]
doxygen_recursive = false
doxygen_file_patterns = ["*.hh"]
# Doxygen's preprocessor follows quoted includes relative to the including
# file's own directory whatever SEARCH_INCLUDES says, descends into the
# upstream dune/xt/ headers that are not in INPUT, and loses its #if/#endif
# balance somewhere down there — every file it names is balanced itself. Fatal
# under WARN_AS_ERROR, and about code neither tool was asked to document.
doxygen_extra = ["ENABLE_PREPROCESSING = NO"]

[patch]
files = ["dune/gdt/operators/interfaces.hh"]
# A top-level input no other input includes, so the incremental-leaf scenario
# re-parses a single translation unit.
leaf_files = ["dune/gdt/norms.hh"]
