# Eigen — header-only linear algebra library (hosted on GitLab).
# Heavily templated; a great stress test for the libclang parser. Pinned to the
# 3.4.0 release tag for reproducibility.
name = "eigen"
repo = "https://gitlab.com/libeigen/eigen.git"
ref = "3.4.0"
std = "c++17"
include_dirs = ["."]
# The trailing recursive glob is what gives clangquill the same tree Doxygen
# scans (arch/, functors/, products/, util/ — not just the top-level Core
# headers); FILE_PATTERNS keeps Doxygen on the identical file set.
#
# The named headers ahead of it are an include order, not an input list.
# clangquill builds one umbrella translation unit including its inputs in the
# order given, and a single glob is alphabetical — so ArithmeticSequence.h and
# Stride.h would land before the util/ headers defining Index, FixedInt,
# symbolic:: and EIGEN_DEVICE_FUNC. Naming those first, in Eigen/Core's own
# order (the only order they work in), fixes it; the glob then picks up
# everything including util/ again, and the include guards make the repeats
# no-ops. This list is a transcription of Eigen/Core at 3.4.0 — re-check it
# when bumping `ref`.
#
# This does not make the parse clean. Reshaped.h, ArithmeticSequence.h and
# BlasUtil.h still need util/IndexedViewHelper.h and util/ReshapedHelper.h,
# and plugins/*.h are textual includes that are not translation units at all,
# so finishing the job means transcribing the whole of Eigen/Core's ~100-line
# include order into this file and keeping it correct across releases. What is
# here takes the cross-check from 49 % to 91 % of Doxygen's documented
# entities, which is the useful part of the signal.
inputs = [
    "Eigen/src/Core/util/Macros.h",
    "Eigen/src/Core/util/ConfigureVectorization.h",
    "Eigen/src/Core/util/MKL_support.h",
    "Eigen/src/Core/util/Constants.h",
    "Eigen/src/Core/util/Meta.h",
    "Eigen/src/Core/util/ForwardDeclarations.h",
    "Eigen/src/Core/util/StaticAssert.h",
    "Eigen/src/Core/util/XprHelper.h",
    "Eigen/src/Core/util/Memory.h",
    "Eigen/src/Core/util/IntegralConstant.h",
    "Eigen/src/Core/util/SymbolicIndex.h",
    "Eigen/src/Core/**/*.h",
]
# Eigen/Core includes these before its own headers; util/Constants.h and
# util/Memory.h use std::string and std::allocator without including either.
compile_args = [
    "-include", "string",
    "-include", "sstream",
    "-include", "memory",
    "-include", "complex",
    "-include", "limits",
]
doxygen_input = ["Eigen/src/Core"]
doxygen_file_patterns = ["*.h"]
# Everything lives under the single `Eigen` namespace: the default
# group_by="symbol" collapses the whole subtree onto one page (84 % of the
# output bytes in one file), which dominates the render, serialises Sphinx's
# read phase, and re-renders on every symbol change. Namespace grouping splits
# it into balanced pages — the recommended setting for namespace-rooted
# libraries.
group_by = "namespace"

[patch]
files = ["Eigen/src/Core/Matrix.h"]
# A header no sibling Core header includes, so the incremental-leaf scenario
# re-parses only its own translation unit.
leaf_files = ["Eigen/src/Core/Stride.h"]
