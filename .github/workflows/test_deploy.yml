---
# Build the package on every PR; publish to Test PyPI only on pushes to main or
# version tags (so PRs verify the build without needing a publish token).
#
# Linux wheels are built per-architecture on native runners (x86_64 + aarch64);
# a single publish job (push events only) gathers every artifact.
name: test-deploy
on:
  pull_request:
  push:
    branches: [main]
    tags: [v*]
# Cancel a stale PR run when new commits land; let push (main/tags) runs
# finish so a Test PyPI publish is never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build_wheels:
    name: Wheels on linux/${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
                # Native runners per arch (arm64 runners are free for public
                # repos) — far faster and more reliable than QEMU emulation.
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
                  # full history so setuptools_scm derives the version
          fetch-depth: 0
      - name: Build manylinux wheels
              # A plain `python -m build --wheel` tags the artefact
              # linux_<arch>, which PyPI rejects. cibuildwheel produces the
              # manylinux-tagged wheels PyPI accepts.
        uses: pypa/cibuildwheel@v4.2.0
        env:
                  # The core links sqlite3 + nlohmann-json, sourced via vcpkg
                  # inside the manylinux image (apt is unavailable there).
                  # The CMake build fetches and bootstraps vcpkg itself
                  # (cmake/VcpkgBootStrap.cmake), into a .vcpkg-checkout
                  # reused by every build in the container.
                  # libclang is now bundled from the official LLVM release per
                  # ADR-0001 (self-contained libclang.so; needs manylinux_2_34).
          CIBW_BUILD: cp311-* cp312-* cp313-*
          CIBW_SKIP: '*-musllinux*'
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_BUILD_VERBOSITY: '1'
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34
                  # manylinux_2_28 ships unzip/tar/curl but not zip, which
                  # vcpkg's bootstrap requires; install it (a vcpkg build
                  # prerequisite, not a C++ dependency) up front.
          CIBW_BEFORE_ALL_LINUX: >-
            dnf -y install zip unzip tar curl xz &&
            cp {project}/tools/ci/vcpkg-asset-fetch.sh /opt/vcpkg-asset-fetch.sh &&
            chmod +x /opt/vcpkg-asset-fetch.sh &&
            cp {project}/tools/ci/fetch-libclang.sh /opt/fetch-libclang.sh &&
            cp {project}/tools/ci/llvm-version.txt /opt/llvm-version.txt &&
            chmod +x /opt/fetch-libclang.sh &&
            /opt/fetch-libclang.sh /opt/libclang &&
            cp /opt/libclang/LICENSE.TXT {project}/LICENSE-LLVM.txt
           # cibuildwheel evaluates each CIBW_ENVIRONMENT value through
                  # bashlex, which rejects a bare `NAME=value` (it parses as a
                  # shell assignment), so SKBUILD_CMAKE_DEFINE must be quoted.
                  # sqlite.org also 403s vcpkg's default downloader, so distfiles
                  # go through a browser-User-Agent script (SHA512 still checked).
          CIBW_ENVIRONMENT_LINUX: >-
            LD_LIBRARY_PATH=/opt/libclang/lib
            SKBUILD_CMAKE_DEFINE="CLANGQUILL_WITH_LIBCLANG=ON;LibClang_ROOT=/opt/libclang"
            X_VCPKG_ASSET_SOURCES="clear;x-script,/opt/vcpkg-asset-fetch.sh {url}
            {sha512} {dst}"
          CIBW_TEST_COMMAND: >-
            python -c "from clangquill import _core;
            assert _core.have_libclang();
            print(_core.__core_version__, _core.libclang_version())"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
  build_wheels_windows:
    name: Wheels on windows/AMD64
    runs-on: windows-2022
        # Safety net: the libclang fetch/extract + vcpkg bootstrap should take
        # single-digit minutes; bound the job so a hang fails fast instead of
        # silently burning the 6h GitHub Actions default job timeout.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
                  # full history so setuptools_scm derives the version
          fetch-depth: 0
      - name: Build Windows wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
                  # Mirrors the Linux job above: same libclang (fetched by the
                  # Windows counterpart of fetch-libclang.sh, see docs
                  # ADR-0001) and the same vcpkg-sourced sqlite3 +
                  # nlohmann-json. A single cp313 build covers 3.13+: `_core`
                  # is built with nanobind STABLE_ABI, which pins
                  # Py_LIMITED_API to 3.12 regardless of build interpreter, so
                  # the wheel tag is cp312-abi3 and installs unchanged on
                  # later interpreters. cibuildwheel 4 repairs Windows wheels
                  # with delvewheel by default; --add-path points it at
                  # libclang.dll.
          CIBW_BUILD: cp313-*
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BUILD_VERBOSITY: '1'
                  # One PowerShell script does the whole setup: stages the CI
                  # helper scripts at a fixed path (CIBW_ENVIRONMENT_WINDOWS
                  # gets no {project} substitution, same restriction as
                  # CIBW_ENVIRONMENT_LINUX above) and fetches libclang; vcpkg
                  # is bootstrapped by the CMake build itself.
          CIBW_BEFORE_ALL_WINDOWS: >-
            powershell -NoProfile -ExecutionPolicy Bypass
            -File {project}\tools\ci\wheel-setup-windows.ps1
                  # vcpkg's default triplet on Windows would build sqlite3 as a
                  # shared DLL; the *-static-md triplet keeps it (and
                  # nlohmann-json) statically linked while still using the
                  # dynamic CRT that Python extensions require, so libclang.dll
                  # is the only third-party DLL the wheel needs to vendor.
          CIBW_ENVIRONMENT_WINDOWS: >-
            VCPKG_TARGET_TRIPLET="x64-windows-static-md"
            PATH="C:\\libclang\\bin;$PATH"
            SKBUILD_CMAKE_DEFINE="CLANGQUILL_WITH_LIBCLANG=ON;LibClang_ROOT=C:\\libclang;VCPKG_TARGET_TRIPLET=x64-windows-static-md"
            X_VCPKG_ASSET_SOURCES="clear;x-script,powershell -NoProfile -ExecutionPolicy
            Bypass -File C:\\ci\\vcpkg-asset-fetch.ps1 {url}
            {sha512} {dst}"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path C:\libclang\bin -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: >-
            python -c "from clangquill import _core;
            assert _core.have_libclang();
            print(_core.__core_version__, _core.libclang_version())"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-windows-AMD64
          path: ./wheelhouse/*.whl
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.x
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --sdist --outdir dist/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sdist
          path: ./dist/*.tar.gz
  deploy:
    name: Publish to Test PyPI
        # Build jobs run on PRs too (to verify every arch); only pushes publish.
    if: github.event_name == 'push'
    needs: [build_wheels, build_wheels_windows, build_sdist]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Gather wheels and sdist
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish distribution 📦 to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
