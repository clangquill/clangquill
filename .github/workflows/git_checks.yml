---
on: [pull_request, merge_group]
name: Git
# Cancel a stale run when new commits land on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  message-check:
    name: Block Autosquash Commits
    runs-on: ubuntu-24.04
    steps:
      # This action only understands pull_request events (it reads PR
      # commits via the API); autosquash commits are already vetted
      # before a PR enters the merge queue, so skip it on merge_group.
      - name: Block Autosquash Commits
        if: github.event_name == 'pull_request'
        uses: xt0rted/block-autosquash-commits-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
  merge_conflict_job:
    runs-on: ubuntu-24.04
    name: Find merge conflicts
    steps:
      # Checkout the source code so we have some files to look at.
      - uses: actions/checkout@v7.0.1
      # Run the actual merge conflict finder
      - name: Merge Conflict finder
        uses: olivernybroe/action-conflict-finder@v4.1
