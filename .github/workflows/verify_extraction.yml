---
# Verify — rather than time — ClangQuill and Doxygen across the same real C++
# codebases the benchmark measures. For every repo configured under
# benchmarks/configs/ the harness asserts that ClangQuill parses it with no
# diagnostic of warning severity or worse, that Doxygen produced the reference
# XML from the identical file set, that ClangQuill did not document fewer source
# files than Doxygen did, and that re-parsing one translation unit per input
# yields the same symbols as the default umbrella batching. Doxygen's own
# warnings are logged and counted but do not gate: they are facts about Doxygen,
# not about the tool under test. Nothing is timed and nothing is published; the
# job is red exactly when one of those four claims is false.
#
# Two scopes (see issue 173). Push/PR/merge queue verify clangquill, abseil
# and eigen — every config cheap enough to clone (or, for clangquill, skip
# cloning entirely) and re-parse in well under a minute — giving every PR the
# same real-parser signal that first caught the input-order,
# forward-declaration and comment-swallowing bugs this workflow exists for.
# The weekly run (Mondays) and manual dispatch cover every configured
# project, dune-gdt included: its config drives a `cmake --preset` that
# bootstraps the whole DUNE stack through vcpkg, on the order of an hour, which
# is fine unattended overnight and not fine blocking a PR. Weekly also catches
# the slower drift a per-push run can't: an upstream project moving, a
# libclang upgrade changing what parses, or a regression a green parse would
# hide.
name: verify-extraction
on:
  push:
    branches: [main]
  merge_group:
  # No `branches:` filter: a stacked PR based on another feature branch must
  # still be verified, and GitHub's auto-retarget to main fires only `edited`,
  # which would never re-trigger a filtered workflow.
  pull_request:
  schedule:
    # 05:00 UTC on Mondays — off-peak for hosted runners, and early enough in
    # the week that a red result has somewhere to go.
    - cron: 0 5 * * 1
  workflow_dispatch:
    inputs:
      repos:
        description: Comma-separated repo configs to narrow scope (empty = every config
          under benchmarks/configs/)
        default: ''
      fresh_clone:
        description: Re-clone the upstream projects instead of reusing an existing
          checkout
        type: boolean
        default: false
# One verification run per ref at a time; a newer run cancels an in-flight one
# rather than having two of them fight over the same clones. Push/merge_group
# runs are left to finish, matching test.yml and cpp_tests.yml.
concurrency:
  group: verify-extraction-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    # Read-only: unlike the benchmark, this workflow publishes nothing and opens
    # no pull request.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The harness only does local git ops against its own clones.
          persist-credentials: false
      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen
      - name: Install build dependencies (LLVM 23)
        # The verification must judge the code on this branch, not a previously
        # published wheel, so the core is built from this checkout. LLVM 23
        # matches the libclang major bundled into release wheels; the distro
        # libclang is older and would report a different set of diagnostics,
        # which is precisely what this workflow gates on.
        # Use the repository-controlled installer (pinned key fingerprint +
        # pinned llvm-toolchain-<codename>-23 suite) rather than executing the
        # mutable upstream helper script.
        # sqlite3 and nlohmann-json are not installed from apt: they come from
        # vcpkg, which the CMake build bootstraps itself.
        run: |
          bash tools/ci/install-llvm-apt.sh
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Install harness dependencies (checkout build)
        # benchmarks/ is a standalone uv project shared by both drivers; sync
        # pulls its dependencies (and the locked clangquill wheel as a
        # placeholder), then the wheel is replaced with a build of the
        # checked-out source so the verdict is about this commit. The assert
        # fails fast if the core silently linked against an older distro
        # libclang, and the version the checkout build installed is recorded so
        # the run step can verify it is still the one being exercised.
        env:
          SKBUILD_CMAKE_DEFINE: CLANGQUILL_WITH_LIBCLANG=ON;LibClang_ROOT=/usr/lib/llvm-23
          # sqlite.org 403s vcpkg's default downloader, so distfiles go through
          # a browser-User-Agent script (SHA512 is still checked by vcpkg).
          X_VCPKG_ASSET_SOURCES: >-
            clear;x-script,${{ github.workspace }}/tools/ci/vcpkg-asset-fetch.sh
            {url} {sha512} {dst}
        run: |
          uv sync --frozen --project benchmarks
          uv pip install --python benchmarks/.venv/bin/python --reinstall-package clangquill .
          benchmarks/.venv/bin/python -c "from clangquill._libclang import libclang_major; assert (libclang_major() or 0) >= 23, libclang_major()"
          built=$(benchmarks/.venv/bin/python -c "import importlib.metadata as m; print(m.version('clangquill'))")
          echo "Built clangquill $built from the checkout"
          echo "CLANGQUILL_BUILT_VERSION=$built" >> "$GITHUB_ENV"
      - name: Verify extraction
        # `uv run` puts the project's venv bin on PATH, so the harness resolves
        # `clangquill` by name; `doxygen` comes from apt. `--no-sync` is
        # load-bearing: without it `uv run` re-syncs the environment to
        # benchmarks/uv.lock and silently replaces the checkout build with the
        # locked PyPI wheel — which would verify a released version instead of
        # this branch. The version check makes that failure loud rather than
        # silent. Dispatch inputs are passed via env (not interpolated into the
        # script) so they can never expand into executable shell.
        env:
          # Push/PR/merge_group get every config except dune-gdt: cheap enough
          # to run on every change, and none of them clone-and-build the DUNE
          # stack through vcpkg. Schedule and dispatch get everything —
          # dune-gdt's ~1h `cmake --preset` build is fine unattended overnight
          # but not fine blocking a PR — unless a dispatch narrows the scope
          # itself via its `repos` input. Order matters here: an empty
          # `inputs.repos` is falsy, so it must sit before the final `''`
          # (meaning "every config"), or a later fallback would silently
          # override a deliberately empty dispatch input.
          VERIFY_REPOS: >-
            ${{ (github.event_name == 'push' || github.event_name == 'pull_request'
                 || github.event_name == 'merge_group') && 'clangquill,abseil,eigen'
            ||
                inputs.repos ||
                '' }}
          VERIFY_FRESH_CLONE: ${{ inputs.fresh_clone }}
        run: |
          actual=$(benchmarks/.venv/bin/python -c "import importlib.metadata as m; print(m.version('clangquill'))")
          if [ "$actual" != "$CLANGQUILL_BUILT_VERSION" ]; then
            echo "benchmarks venv holds clangquill $actual, not the checkout build $CLANGQUILL_BUILT_VERSION — refusing to verify the wrong binary" >&2
            exit 1
          fi
          fresh=""
          if [ "$VERIFY_FRESH_CLONE" = "true" ]; then
            fresh="--fresh-clone"
          fi
          # -u keeps the harness's per-repo/per-check progress lines unbuffered:
          # python block-buffers stdout on a pipe, so a killed run would
          # otherwise leave no trace of how far it got in the CI log.
          uv run --no-sync --project benchmarks python -u benchmarks/verify.py \
            --repos "$VERIFY_REPOS" $fresh
      - name: Publish results to job summary
        if: always()
        run: |
          # The verify step exits non-zero on any failed check, so this step must
          # run regardless — the report is most useful precisely when the run is
          # red. It must not fail on its own, hence the guards.
          if [ ! -d benchmarks/verify-results ]; then
            echo "No verification results were produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Result files are named with a sortable UTC timestamp, so the last
          # one lexicographically is the newest. (find/sort avoids parsing `ls`.)
          latest=$(find benchmarks/verify-results -maxdepth 1 -name '*.md' | sort | tail -1)
          if [ -n "$latest" ]; then
            cat "$latest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No verification results were produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload results and per-project logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verify-extraction-results
          # The reports plus every project's clangquill diagnostics and doxygen
          # warning logs: the summary shows the first lines of a failure, these
          # hold the rest.
          path: |
            benchmarks/verify-results/
            benchmarks/.work/_bench/*/logs/
          if-no-files-found: ignore
