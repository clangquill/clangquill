---
name: wheels
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  merge_group:
  workflow_dispatch:
# Cancel a stale PR run when new commits land; let push (main/tags) and
# manual dispatch runs finish so tagged wheel builds are never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build_wheels:
    name: Wheels on linux/${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
                # Build each Linux arch on its own native runner (arm64 runners
                # are free for public repos) — far faster than QEMU emulation.
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
                  # full history so setuptools_scm derives the version
          fetch-depth: 0
      - name: Build manylinux wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
                  # The core links sqlite3 + nlohmann-json, sourced via vcpkg
                  # inside the manylinux image (apt is unavailable there).
                  # The CMake build fetches and bootstraps vcpkg itself
                  # (cmake/VcpkgBootStrap.cmake), into a .vcpkg-checkout
                  # reused by every build in the container.
                  # libclang is now bundled from the official LLVM release per
                  # ADR-0001 (self-contained libclang.so; needs manylinux_2_35).
                  # A single cp313 build covers every later interpreter: `_core`
                  # is built with nanobind STABLE_ABI, which nanobind pins to
                  # Py_LIMITED_API 3.12 regardless of the build interpreter, so
                  # the wheel tag is `cp312-abi3` and installs unchanged on 3.13,
                  # 3.14, ... — building a second cp314 wheel would just produce
                  # a byte-for-byte duplicate under the same tag. Python 3.14
                  # compatibility is instead verified by the smoke_test job below.
          CIBW_BUILD: cp313-*
          CIBW_SKIP: '*-musllinux*'
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_BUILD_VERBOSITY: '1'
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34
                  # LLVM 23's release libclang imports
                  # std::condition_variable::wait at GLIBCXX_3.4.30 (GCC 12),
                  # which auditwheel's manylinux_2_34 policy caps at 3.4.29, so
                  # the wheel is repaired to manylinux_2_35 -- the lowest policy
                  # that allows it (see ADR-0001). The *build* image stays
                  # manylinux_2_34: it is the newest pypa publishes for
                  # x86_64/aarch64, and the bundled libclang is a prebuilt
                  # binary the image's own GCC never touches. Only the declared
                  # floor moves, glibc 2.34 -> 2.35.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --plat manylinux_2_35_${{ matrix.arch }}
            -w {dest_dir} {wheel}
                  # manylinux_2_28 ships unzip/tar/curl but not zip, which
                  # vcpkg's bootstrap requires; install it (a vcpkg build
                  # prerequisite, not a C++ dependency) up front.
          CIBW_BEFORE_ALL_LINUX: >-
            dnf -y install zip unzip tar curl xz &&
            cp {project}/tools/ci/vcpkg-asset-fetch.sh /opt/vcpkg-asset-fetch.sh &&
            chmod +x /opt/vcpkg-asset-fetch.sh &&
            cp {project}/tools/ci/fetch-libclang.sh /opt/fetch-libclang.sh &&
            cp {project}/tools/ci/llvm-version.txt /opt/llvm-version.txt &&
            chmod +x /opt/fetch-libclang.sh &&
            /opt/fetch-libclang.sh /opt/libclang &&
            cp /opt/libclang/LICENSE.TXT {project}/LICENSE-LLVM.txt
           # cibuildwheel evaluates each CIBW_ENVIRONMENT value through
                  # bashlex, which rejects a bare `NAME=value` (it parses as a
                  # shell assignment), so SKBUILD_CMAKE_DEFINE must be quoted.
                  # sqlite.org also 403s vcpkg's default downloader, so distfiles
                  # go through a browser-User-Agent script (SHA512 still checked).
          CIBW_ENVIRONMENT_LINUX: >-
            LD_LIBRARY_PATH=/opt/libclang/lib
            SKBUILD_CMAKE_DEFINE="CLANGQUILL_WITH_LIBCLANG=ON;LibClang_ROOT=/opt/libclang"
            X_VCPKG_ASSET_SOURCES="clear;x-script,/opt/vcpkg-asset-fetch.sh {url}
            {sha512} {dst}"
          # A manylinux_2_35 wheel cannot be installed in the manylinux_2_34
          # image that built it — pip there sees glibc 2.34 and rejects the tag,
          # and the GLIBCXX_3.4.30 import would fail even if it did not. So the
          # in-container test is skipped and the identical suite runs in the
          # step below instead.
          CIBW_TEST_SKIP: '*-manylinux_*'
      - name: Test the repaired wheel outside the build image
          # The wheel is tested by the real suite, not an import smoke:
          # aarch64 ships to users on the strength of this run, and a
          # parse-heavy suite is what exercises the paths that actually differ
          # per platform. The `_core` assert stays in front of it because every
          # parser test is skipped (not failed) when libclang is missing, so
          # pytest alone could go green on a wheel that bundles nothing.
          # Debian 12 (glibc 2.36) clears the wheel's 2.35 floor and ships no
          # system LLVM, so this also proves the bundled libclang stands alone.
        run: >-
          docker run --rm -v "$PWD:/work" -w /work python:3.13-slim-bookworm
          bash -ec '
          python -m pip install wheelhouse/*.whl pytest pytest-cov
          pytest-datadir pytest-regressions sphinx myst-parser;
          python -c "from clangquill import _core;
          assert _core.have_libclang();
          print(_core.__core_version__, _core.libclang_version())";
          pytest tests'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
  build_wheels_windows:
    name: Wheels on windows/AMD64
    runs-on: windows-2022
        # Safety net: the libclang fetch/extract + vcpkg bootstrap should take
        # single-digit minutes; bound the job so a hang fails fast instead of
        # silently burning the 6h GitHub Actions default job timeout.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
                  # full history so setuptools_scm derives the version
          fetch-depth: 0
      - name: Build Windows wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
                  # Mirrors the Linux job above: same libclang (fetched by the
                  # Windows counterpart of fetch-libclang.sh, see docs
                  # ADR-0001) and the same vcpkg-sourced sqlite3 +
                  # nlohmann-json, plus the same single-cp313-build reasoning
                  # (nanobind STABLE_ABI => cp312-abi3, forward-compatible).
                  # cibuildwheel 4 repairs Windows wheels with delvewheel by
                  # default; --add-path points it at libclang.dll.
          CIBW_BUILD: cp313-*
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BUILD_VERBOSITY: '1'
                  # One PowerShell script does the whole setup: stages the CI
                  # helper scripts at a fixed path (CIBW_ENVIRONMENT_WINDOWS
                  # gets no {project} substitution, same restriction as
                  # CIBW_ENVIRONMENT_LINUX above) and fetches libclang; vcpkg
                  # is bootstrapped by the CMake build itself.
          CIBW_BEFORE_ALL_WINDOWS: >-
            powershell -NoProfile -ExecutionPolicy Bypass
            -File {project}\tools\ci\wheel-setup-windows.ps1
          # vcpkg's default triplet on Windows would build sqlite3 as a shared
          # DLL; the *-static-md triplet keeps it (and nlohmann-json)
          # statically linked while still using the dynamic CRT that Python
          # extensions require, so libclang.dll is the only third-party DLL the
          # wheel needs to vendor.
          CIBW_ENVIRONMENT_WINDOWS: >-
            VCPKG_TARGET_TRIPLET="x64-windows-static-md"
            PATH="C:\\libclang\\bin;$PATH"
            SKBUILD_CMAKE_DEFINE="CLANGQUILL_WITH_LIBCLANG=ON;LibClang_ROOT=C:\\libclang;VCPKG_TARGET_TRIPLET=x64-windows-static-md"
            X_VCPKG_ASSET_SOURCES="clear;x-script,powershell -NoProfile -ExecutionPolicy
            Bypass -File C:\\ci\\vcpkg-asset-fetch.ps1 {url}
            {sha512} {dst}"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path C:\libclang\bin -w {dest_dir} {wheel}
          # Same as the Linux job: run the suite against the built wheel. This
          # is the only place the Windows-specific code (path handling,
          # `Generator._unique_stem`'s case-insensitive-filesystem guard,
          # MSVC-built parser behaviour) is executed by anything but an import
          # check.
          CIBW_TEST_REQUIRES: >-
            pytest pytest-cov pytest-datadir pytest-regressions sphinx
            myst-parser
          CIBW_TEST_COMMAND: >-
            python -c "from clangquill import _core;
            assert _core.have_libclang();
            print(_core.__core_version__, _core.libclang_version())" &&
            pytest {project}/tests
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-windows-AMD64
          path: ./wheelhouse/*.whl
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Build sdist
        run: uv build --sdist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sdist
          path: ./dist/*.tar.gz
  smoke_test:
    name: Smoke-test wheel on ${{ matrix.arch }} (${{ matrix.python }})
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
              # cp313 is the interpreter the wheel was built against; cp314
              # proves the cp312-abi3 wheel (see build_wheels above) installs
              # and runs unmodified on the next interpreter too. cp312 backs
              # the other half of that tag: the extension is built against
              # Py_LIMITED_API 3.12, so it must import and parse there as well.
              # `requires-python = ">=3.13"` deliberately keeps 3.12 users off
              # the wheel, so this one install lifts the metadata guard — it
              # tests the ABI claim, not the support claim.
        python: [cp312, cp313, cp314]
              # Debian 12 (glibc 2.36), not a manylinux image: the wheel now
              # declares manylinux_2_35, and pypa publishes no 2_35 image for
              # x86_64/aarch64 (2_35 is armv7l-only, 2_39 aarch64/riscv64), so
              # pip in the 2_34 image would refuse the wheel outright. 2.36 sits
              # one notch above the declared floor rather than exactly on it —
              # what this job proves is unchanged either way: a clean image with
              # no system LLVM installs the wheel and parses with the libclang
              # it bundles.
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - python: cp312
            image: python:3.12-slim-bookworm
            pip_flags: --ignore-requires-python
          - python: cp313
            image: python:3.13-slim-bookworm
          - python: cp314
            image: python:3.14-slim-bookworm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.os }}
          path: dist
            # Install the wheel in a clean image that has no system LLVM and
            # parse a header — proves the bundled libclang is self-contained
            # (the build-time CIBW test runs with libclang still on
            # LD_LIBRARY_PATH, which this deliberately does not).
      - name: Install wheel and parse in ${{ matrix.image }} (${{ matrix.python }})
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ${{ matrix.image }}
          bash -ec '
          python -m pip install ${{ matrix.pip_flags }} dist/*.whl;
          python tools/ci/smoke_test.py'
  smoke_test_windows:
    name: Smoke-test wheel on windows/AMD64 (${{ matrix.python-version }})
    needs: build_wheels_windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
              # 3.13 is the interpreter the wheel was built against; 3.14
              # proves the cp312-abi3 wheel installs and runs unmodified on
              # the next interpreter too (a fresh runner, so no system LLVM
              # and no libclang left over from the build job, unlike the
              # build-time CIBW_TEST_COMMAND above).
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-AMD64
          path: dist
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install wheel and parse
        run: |-
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          python -m pip install $wheel.FullName
          python tools/ci/smoke_test.py
