---
on:
  push:
    branches: [main]
  merge_group:
  # No `branches:` filter: a stacked PR based on another feature branch
  # must still be tested, and GitHub's auto-retarget to main fires only
  # `edited`, which would never re-trigger a filtered workflow.
  pull_request:
name: pytest
# Cancel a stale PR run when new commits land; let push/merge_group runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  py-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.py }})
    strategy:
      fail-fast: false
      matrix:
                # 3.13 is the floor (`requires-python = ">=3.13"`); 3.14 is
                # the next interpreter, built from source here rather than only
                # smoke-tested as a wheel. A 3.12 entry cannot exist while the
                # floor is 3.13, even though the abi3 wheel is tagged cp312 —
                # that tag's claim is checked in wheels.yml instead, by
                # installing the built wheel on 3.12 with the metadata guard
                # lifted.
        config:
          - {os: ubuntu-24.04, py: '3.13'}
          - {os: ubuntu-24.04, py: '3.14'}
    env:
      OS: ${{ matrix.config.os }}
      PYTHON: ${{ matrix.config.py }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          # sqlite.org 403s vcpkg's default downloader, so distfiles go through
          # a browser-User-Agent script (SHA512 is still checked by vcpkg).
      X_VCPKG_ASSET_SOURCES: >-
        clear;x-script,${{ github.workspace }}/tools/ci/vcpkg-asset-fetch.sh
        {url} {sha512} {dst}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
          # Only libclang comes from apt; sqlite3 and nlohmann-json are
          # provided by vcpkg, bootstrapped by the CMake build itself.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.config.py }}
      - name: Install dependencies
      # Build the core with libclang so the parser path is exercised by pytest.
        env:
          SKBUILD_CMAKE_DEFINE: CLANGQUILL_WITH_LIBCLANG=ON
        run: uv sync --frozen --extra ci
      - name: run pytest
        run: uv run pytest
      - name: Upload coverage
      # codecov rejects a tokenless upload outright, so an absent
      # CODECOV_TOKEN — on a fork PR, or wherever the secret is simply not
      # configured — has to skip the step rather than fail the run. Where the
      # token *is* set the upload is a real gate (fail_ci_if_error below).
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7.0.0
        with:
          env_vars: OS,PYTHON
          # pytest writes coverage.xml (see pyproject addopts). Name it and
          # turn the search off: left to itself the uploader also finds
          # coverage-shaped files inside .vcpkg-checkout.
          files: coverage.xml
          disable_search: true
          flags: python
          # The report now exists, so a failed upload means a real problem.
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
    # Docs build on the distro libclang (18). The C++23/26 dogfood header is
    # gated on libclang >= 22, so here it is omitted — exercising the graceful
    # "older toolchain never fails the docs build" path. One interpreter is
    # enough for that: this asserts a libclang-version behaviour, not a Python
    # one, and the docs toolchain gets its own job below.
      - name: build docs
        if: matrix.config.py == '3.13'
        run: |
          uv sync --frozen --extra docs
          uv run make -C docs html
  pytest-newer-llvm:
    # pytest against LLVM 22 — the libclang major bundled into release wheels.
    # The matrix job above runs on the distro libclang (18), so without this the
    # only parses ever done against 22 are the weekly verify-extraction run and
    # the docs build below (which renders pages but asserts nothing about them).
    runs-on: ubuntu-24.04
    name: pytest (clang 22)
    env:
          # sqlite.org 403s vcpkg's default downloader, so distfiles go through
          # a browser-User-Agent script (SHA512 is still checked by vcpkg).
      X_VCPKG_ASSET_SOURCES: >-
        clear;x-script,${{ github.workspace }}/tools/ci/vcpkg-asset-fetch.sh
        {url} {sha512} {dst}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
          # The repository-controlled installer (pinned key fingerprint, pinned
          # llvm-toolchain-<codename>-22 suite), as used by verify-extraction.
      - name: Install LLVM 22 from apt.llvm.org
        run: bash tools/ci/install-llvm-22-apt.sh
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        env:
          SKBUILD_CMAKE_DEFINE: CLANGQUILL_WITH_LIBCLANG=ON;LibClang_ROOT=/usr/lib/llvm-22
        run: uv sync --frozen --extra ci
          # The assert is load-bearing: a core that silently linked the distro
          # libclang would make this job a duplicate of the matrix one, and the
          # parser tests skip (not fail) when there is no libclang at all.
          # No coverage upload: same lines as the matrix job, different backend.
      - name: run pytest
        run: |
          uv run python -c "from clangquill._libclang import libclang_major; assert (libclang_major() or 0) >= 22, libclang_major()"
          uv run pytest
  docs-newer-llvm:
    # The published/pages docs build: install clang 22 from apt.llvm.org so the
    # core links against it and actually parses the C++23/26 dogfood header.
    runs-on: ubuntu-24.04
    name: docs (clang 22 dogfood)
    env:
          # sqlite.org 403s vcpkg's default downloader, so distfiles go through
          # a browser-User-Agent script (SHA512 is still checked by vcpkg).
      X_VCPKG_ASSET_SOURCES: >-
        clear;x-script,${{ github.workspace }}/tools/ci/vcpkg-asset-fetch.sh
        {url} {sha512} {dst}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
          # The repository-controlled installer (pinned key fingerprint, pinned
          # llvm-toolchain-<codename>-22 suite), as used by pytest-newer-llvm
          # and verify-extraction -- not the unpinned `apt.llvm.org/llvm.sh`.
      - name: Install LLVM 22 from apt.llvm.org
        run: bash tools/ci/install-llvm-22-apt.sh
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Build core against libclang 22 and render docs
      # FindLibClang resolves llvm-config-22; LibClang_ROOT pins the prefix.
        env:
          SKBUILD_CMAKE_DEFINE: CLANGQUILL_WITH_LIBCLANG=ON;LibClang_ROOT=/usr/lib/llvm-22
        run: |-
          uv sync --frozen --extra docs
          uv run python -c "from clangquill._libclang import libclang_major; assert (libclang_major() or 0) >= 22, libclang_major()"
          uv run make -C docs html
  py-check-no-libclang:
    # Every job above builds with libclang linked, so the `not have_libclang()`
    # branches — the Sphinx extension's placeholder page, the CLI's clean-exit
    # message, the `have_libclang()`/`libclang_version()` stub — were dead code
    # in CI (issue 226). No libclang-dev is installed here on purpose: a build
    # that silently found some other libclang would defeat the point.
    runs-on: ubuntu-24.04
    name: pytest (no libclang)
    env:
          # sqlite.org 403s vcpkg's default downloader, so distfiles go through
          # a browser-User-Agent script (SHA512 is still checked by vcpkg).
      X_VCPKG_ASSET_SOURCES: >-
        clear;x-script,${{ github.workspace }}/tools/ci/vcpkg-asset-fetch.sh
        {url} {sha512} {dst}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        env:
          SKBUILD_CMAKE_DEFINE: CLANGQUILL_WITH_LIBCLANG=OFF
        run: uv sync --frozen --extra ci
          # Load-bearing, like the pytest-newer-llvm assert: a core that
          # silently linked a libclang would make every test below skip via
          # the ordinary `not have_libclang()` markers instead of exercising
          # the stub backend they exist to cover.
      - name: Assert the stub backend actually landed
        run: |
          uv run python -c "
          from clangquill import _core
          assert not _core.have_libclang()
          assert _core.libclang_version() == ''
          "
      - name: run pytest
        run: uv run pytest
