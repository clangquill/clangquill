---
name: cpp-tests
on:
  push:
    branches: [main]
  merge_group:
  # No `branches:` filter: a stacked PR based on another feature branch
  # must still be tested, and GitHub's auto-retarget to main fires only
  # `edited`, which would never re-trigger a filtered workflow.
  pull_request:
# Cancel a stale PR run when new commits land; let push/merge_group runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ctest:
    name: C++ unit tests
    runs-on: ubuntu-24.04
    env:
          # sqlite.org 403s vcpkg's default downloader, so distfiles go through
          # a browser-User-Agent script (SHA512 is still checked by vcpkg).
      X_VCPKG_ASSET_SOURCES: >-
        clear;x-script,${{ github.workspace }}/tools/ci/vcpkg-asset-fetch.sh
        {url} {sha512} {dst}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
            # Only the build tools and libclang come from apt: sqlite3,
            # nlohmann-json and catch2 are provided by vcpkg, which the CMake
            # build bootstraps itself (cmake/VcpkgBootStrap.cmake).
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libclang-dev
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install nanobind (build-time dependency) and gcovr
        run: python -m pip install nanobind 'gcovr==8.4'
            # `--coverage` on both the compile and the link line instruments the
            # C++ sources so ctest leaves .gcda files behind. The suite is a
            # correctness gate, not a benchmark, so measuring the same build it
            # gates is cheaper (and less prone to drift) than a second job that
            # rebuilds everything just to count lines.
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCLANGQUILL_WITH_LIBCLANG=ON
          -DCLANGQUILL_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS=--coverage
          -DCMAKE_EXE_LINKER_FLAGS=--coverage
          -DPython_EXECUTABLE="$(which python)"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
            # Only clangquill's own sources count: the filter drops libclang,
            # Catch2 and the vcpkg-installed headers. src/cpp/bindings is
            # included and will read as uncovered — the nanobind layer is
            # exercised by pytest, not by ctest, and the two reports land under
            # separate codecov flags. gcov (GCC 13) emits an occasional
            # `branch 1 taken -1` for a real line — a known gcov bug
            # (gcc.gnu.org/PR68080) that gcovr treats as fatal by default;
            # downgrade just that one to a per-file warning.
      - name: Collect coverage
        run: >-
          gcovr --root . build --filter 'src/cpp/'
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file
          --xml cpp-coverage.xml --txt --print-summary
      - name: Upload coverage
            # Same token guard as the pytest workflow: no CODECOV_TOKEN on a
            # fork PR (or where the secret is unset), and codecov rejects a
            # tokenless upload.
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7.0.0
        with:
          files: cpp-coverage.xml
          disable_search: true
          flags: cpp
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
  ctest-windows:
    # The Catch2 suite has only ever run on Linux/gcc/libstdc++, while a
    # Windows wheel ships to users every release: everything MSVC does
    # differently (its standard library, its filesystem semantics, its
    # case-insensitive paths) was until now covered by nothing but the wheel's
    # own import check.
    name: C++ unit tests (MSVC)
    runs-on: windows-2022
        # The pinned-release fallback below downloads and unpacks a multi-GB
        # LLVM archive; bound the job so a hang fails fast instead of burning
        # the 6h GitHub Actions default.
    timeout-minutes: 60
    env:
          # sqlite.org 403s vcpkg's default downloader, so distfiles go through
          # a browser-User-Agent script (SHA512 is still checked by vcpkg).
      X_VCPKG_ASSET_SOURCES: >-
        clear;x-script,powershell -NoProfile -ExecutionPolicy Bypass -File
        ${{ github.workspace }}\tools\ci\vcpkg-asset-fetch.ps1 {url}
        {sha512} {dst}
      # Matches the Windows wheel build: sqlite3, nlohmann-json and catch2 link
      # statically against the dynamic CRT, so no third-party DLL has to sit
      # next to the test executable.
      VCPKG_TARGET_TRIPLET: x64-windows-static-md
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install nanobind (build-time dependency)
        run: python -m pip install nanobind
          # The runner image ships LLVM, but only its bin/ is guaranteed; the
          # build needs clang-c/Index.h and libclang.lib. Use them when they are
          # there and fall back to the same pinned release the wheels bundle, so
          # the job neither depends on image contents nor pays for a multi-GB
          # download on every run.
      - name: Locate libclang
        shell: pwsh
        run: |
          $root = "C:\Program Files\LLVM"
          $haveHeaders = Test-Path "$root\include\clang-c\Index.h"
          $haveImportLib = Test-Path "$root\lib\libclang.lib"
          if (-not ($haveHeaders -and $haveImportLib)) {
            Write-Host "preinstalled LLVM has no libclang SDK; fetching the pinned release"
            & .\tools\ci\fetch-libclang.ps1 -Prefix C:\libclang
            $root = "C:\libclang"
          }
          Write-Host "using libclang from $root"
          "LIBCLANG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          # The Visual Studio generator is the one that needs no vcvars dance;
          # it is multi-config, hence --config on the build and -C on ctest.
      - name: Configure
        run: >-
          cmake -S . -B build -A x64
          -DCLANGQUILL_WITH_LIBCLANG=ON
          -DCLANGQUILL_BUILD_TESTS=ON
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DLibClang_ROOT="$env:LIBCLANG_ROOT"
          -DPython_EXECUTABLE="$((Get-Command python).Source)"
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
